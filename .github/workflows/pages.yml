name: Deploy to GitHub Pages

# A project site is served from https://<user>.github.io/<repo>/, so the build
# is given that subdirectory as its base path. Every runtime path in the app is
# derived from import.meta.env.BASE_URL, and the service worker derives its own
# from its registration scope, so nothing needs to be told where it lives.

# Manual only, deliberately.
#
# `actions/configure-pages` fails unless Pages is already enabled on the repo
# with "GitHub Actions" as the source, and that is a repository setting a
# workflow cannot turn on for itself. Running this on every push therefore
# painted a red X on main for a prerequisite nobody had asked for — the deploy
# that actually serves this app is Vercel, and Pages is only a fallback.
#
# To use it: Settings → Pages → Source: GitHub Actions, then run this workflow
# from the Actions tab on whichever branch you want published.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for the Pages subdirectory
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
