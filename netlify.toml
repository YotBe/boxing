[build]
  command = "npm run build"
  publish = "dist"

# The service worker must never be served stale, or a redeploy can never
# replace the one already installed on the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Model files and the WASM runtime are large and rarely change. A week of HTTP
# caching keeps a reload cheap even before the service worker has them stored.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
