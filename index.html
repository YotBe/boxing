    <!--
      No webfonts and no CDN preconnects on purpose. This has to come up on a
      network that is broken, blocked, or behind a captive portal, and a
      render-blocking stylesheet from a third-party host is exactly the kind of
      dependency that turns a working demo into a blank screen. The system font
      stack in index.css looks native on every device anyway.
    -->
